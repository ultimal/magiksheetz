<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WebSheets</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAzMiAzMiI+PHJlY3Qgd2lkdGg9IjMyIiBoZWlnaHQ9IjMyIiByeD0iNiIgZmlsbD0iIzI4MmEzNiIvPjxyZWN0IHg9IjUiIHk9IjUiIHdpZHRoPSIyMiIgaGVpZ2h0PSIyMiIgcng9IjIiIGZpbGw9IiM1MGZhN2IiLz48ZyBzdHJva2U9IiMyODJhMzYiIHN0cm9rZS13aWR0aD0iMiI+PGxpbmUgeDE9IjUiIHkxPSIxMiIgeDI9IjI3IiB5Mj0iMTIiLz48bGluZSB4MT0iNSIgeTE9IjE5IiB4Mj0iMjciIHkyPSIxOSIvPjxsaW5lIHgxPSIxMyIgeTE9IjUiIHgyPSIxMyIgeTI9IjI3Ii8+PGxpbmUgeDE9IjIwIiB5MT0iNSIgeDI9IjIwIiB5Mj0iMjciLz48L2c+PC9zdmc+">
<!-- SheetJS for reading/writing .xls / .xlsx -->
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
  :root {
    /* Dracula palette */
    --bg:        #282a36;  /* background        */
    --bg-dark:   #21222c;  /* headers / gutters */
    --bg-darker: #191a21;  /* toolbar           */
    --panel:     #343746;  /* toolbars / inputs */
    --current:   #44475a;  /* current line      */
    --fg:        #f8f8f2;  /* foreground        */
    --comment:   #6272a4;
    --cyan:      #8be9fd;
    --green:     #50fa7b;
    --orange:    #ffb86c;
    --pink:      #ff79c6;
    --purple:    #bd93f9;
    --red:       #ff5555;
    --yellow:    #f1fa8c;

    --border: #44475a;
    --header-bg: #21222c;
    --header-active: #44475a;
    --sel: #bd93f9;
    --sel-fill: rgba(189,147,249,0.20);
    --toolbar-bg: #191a21;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; font-family: "Segoe UI", Calibri, Arial, sans-serif;
    font-size: 13px; color: var(--fg); overflow: hidden; background: var(--bg);
  }
  body { display: flex; flex-direction: column; }

  /* ---------- Quick Access strip ---------- */
  .qat {
    background: var(--bg-darker); color: var(--fg); padding: 4px 10px;
    display: flex; align-items: center; gap: 4px;
  }
  .qat .app-title { font-weight: 700; font-size: 13px; color: var(--purple); margin-right: 10px; letter-spacing: .3px; }
  .qat-btn {
    background: transparent; color: var(--fg); border: none; cursor: pointer;
    font-size: 15px; width: 26px; height: 24px; border-radius: 4px; line-height: 1;
  }
  .qat-btn:hover { background: var(--current); }
  .qat .filename { margin-left: auto; font-size: 12px; color: var(--comment); }

  /* ---------- Single-row icon toolbar ---------- */
  .toolbar2 {
    display: flex; align-items: center; gap: 3px; background: var(--panel);
    border-bottom: 1px solid var(--border); padding: 4px 8px;
    overflow-x: auto; white-space: nowrap;
  }
  .toolbar2 .tb {
    border: 1px solid #565968; background: var(--current); color: var(--fg);
    border-radius: 4px; height: 26px; min-width: 28px; padding: 0 6px; cursor: pointer;
    font-size: 13px; display: inline-flex; align-items: center; justify-content: center;
    gap: 3px; flex: 0 0 auto; line-height: 1;
  }
  .toolbar2 .tb:hover { background: var(--comment); }
  .toolbar2 .tb.active { background: var(--purple); border-color: var(--purple); color: var(--bg-dark); }
  .toolbar2 .tb.active:hover { background: var(--pink); }
  .toolbar2 select {
    border: 1px solid #565968; background: var(--current); color: var(--fg);
    border-radius: 4px; height: 26px; font-size: 12px; flex: 0 0 auto; padding: 0 4px;
  }
  .toolbar2 #fontFamily { min-width: 110px; }
  .toolbar2 #fontSize { min-width: 52px; }
  .toolbar2 #numFmt { min-width: 130px; }
  .toolbar2 .tsep { width: 1px; height: 20px; background: var(--border); margin: 0 4px; flex: 0 0 auto; }
  .toolbar2 input[type=file] { display: none; }
  .toolbar2 #btnHelp { border-radius: 50%; width: 26px; color: var(--cyan); }
  .toolbar2 #btnHelp:hover { background: var(--purple); color: var(--bg-dark); }

  /* ---------- Help / shortcuts panel ---------- */
  .help-pop {
    position: fixed; z-index: 1200; display: none;
    background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
    box-shadow: 0 12px 30px rgba(0,0,0,0.55); padding: 12px 14px 14px;
    width: 380px; max-height: 74vh; overflow-y: auto; font-size: 12px; color: var(--fg);
  }
  .help-pop .help-title { font-weight: 700; color: var(--purple); margin-bottom: 8px; font-size: 13px; }
  .help-pop h4 { margin: 12px 0 4px; color: var(--green); font-size: 12px; border-bottom: 1px solid var(--border); padding-bottom: 3px; }
  .help-pop .krow { display: flex; justify-content: space-between; align-items: baseline; gap: 14px; padding: 3px 0; }
  .help-pop .kdesc { color: var(--fg); text-align: right; flex: 1; }
  .help-pop kbd {
    background: var(--current); border: 1px solid #565968; border-radius: 4px;
    padding: 1px 6px; font-family: Consolas, "Courier New", monospace; font-size: 11px;
    color: var(--cyan); white-space: nowrap;
  }
  .toolbar2 .colorbtn { flex-direction: column; padding: 2px 6px; font-size: 12px; gap: 1px; }
  .toolbar2 .colorbtn .cb-icon { line-height: 1; }
  .toolbar2 .colorbtn .cb-swatch {
    display: block; width: 100%; min-width: 20px; height: 5px; border-radius: 1px;
    background: #f8f8f2; box-shadow: inset 0 0 0 1px rgba(0,0,0,.25);
  }

  /* ---------- Dracula color palette popup ---------- */
  .color-pop {
    position: fixed; z-index: 1150; background: var(--panel);
    border: 1px solid var(--border); border-radius: 6px;
    box-shadow: 0 10px 26px rgba(0,0,0,0.55); padding: 8px; display: none;
    user-select: none;
  }
  .color-pop .cp-title { font-size: 11px; color: var(--comment); margin: 0 2px 6px; }
  .color-pop .cp-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
  .color-pop .cp-sw {
    width: 20px; height: 20px; border-radius: 4px; cursor: pointer;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.18);
  }
  .color-pop .cp-sw:hover { outline: 2px solid var(--purple); outline-offset: 1px; }
  .color-pop .cp-sw.current { outline: 2px solid var(--green); outline-offset: 1px; }
  .color-pop .cp-reset {
    margin-top: 8px; width: 100%; border: 1px solid #565968; background: var(--current);
    color: var(--fg); border-radius: 4px; padding: 5px; cursor: pointer; font-size: 12px;
  }
  .color-pop .cp-reset:hover { background: var(--comment); }

  /* ---------- Formula bar ---------- */
  .formula-bar {
    display: flex; align-items: stretch; border-bottom: 1px solid var(--border);
    background: var(--bg-dark);
  }
  .name-box {
    width: 90px; border: none; border-right: 1px solid var(--border); padding: 5px 8px;
    font-weight: 600; text-align: center; background: var(--panel); color: var(--cyan); outline: none;
  }
  .fx { padding: 5px 8px; color: var(--comment); font-style: italic; border-right: 1px solid var(--border); }
  .formula-input {
    flex: 1; border: none; padding: 5px 8px; font-size: 13px; outline: none;
    font-family: Consolas, "Courier New", monospace; background: var(--bg-dark); color: var(--fg);
  }

  /* ---------- Grid ---------- */
  .grid-wrap { flex: 1; overflow: auto; position: relative; background: var(--bg); outline: none; }
  .grid-wrap:focus, .grid-wrap:focus-visible { outline: none; }
  table.grid { border-collapse: collapse; table-layout: fixed; }
  table.grid th, table.grid td {
    border: 1px solid var(--border); padding: 0; height: 22px;
    overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
  }
  table.grid thead th {
    background: var(--header-bg); color: var(--comment); position: sticky; top: 0; z-index: 3;
    font-weight: 600; text-align: center; user-select: none; cursor: pointer;
    min-width: 70px;
  }
  table.grid thead th.corner { left: 0; z-index: 5; min-width: 42px; width: 42px; }
  table.grid thead th .sort-ind { font-size: 9px; color: var(--green); margin-left: 2px; }
  table.grid thead th.active { background: var(--header-active); color: var(--purple); }
  table.grid tbody th.rowhead {
    background: var(--header-bg); color: var(--comment); position: sticky; left: 0; z-index: 2;
    font-weight: 600; text-align: center; user-select: none; width: 42px; min-width: 42px;
    cursor: pointer;
  }
  table.grid tbody th.rowhead.active { background: var(--header-active); color: var(--purple); }
  table.grid td {
    min-width: 70px; width: 90px; cursor: cell; padding: 0 4px;
    background: var(--bg); color: var(--fg); text-align: left; position: relative;
  }
  table.grid td.num { text-align: right; color: var(--cyan); }
  table.grid td.selected { box-shadow: inset 0 0 0 2px var(--sel); z-index: 1; }
  table.grid td.in-range { background: var(--sel-fill) !important; }
  table.grid td.editing { box-shadow: inset 0 0 0 2px var(--sel); background: var(--bg-dark); }

  /* ---------- Frozen header row (row 0) ---------- */
  table.grid tr.frozen-row td {
    position: sticky; top: calc(var(--head-h, 24px) - 1px); z-index: 2;
    background: var(--header-bg); color: var(--green); font-weight: 600;
  }
  table.grid tr.frozen-row td.num { color: var(--green); }        /* keep header text, not cyan numbers */
  table.grid tr.frozen-row td.in-range { color: var(--fg); }      /* selected header cells stay readable */
  table.grid tr.frozen-row th.rowhead {
    position: sticky; top: calc(var(--head-h, 24px) - 1px); left: 0; z-index: 4;
    background: var(--header-active);
  }
  table.grid td .cell-input {
    position: absolute; inset: 0; border: none; outline: none; padding: 0 4px;
    font: inherit; width: 100%; height: 100%; background: var(--bg-dark); color: var(--fg);
    font-family: Consolas, "Courier New", monospace;
  }
  .col-resizer {
    position: absolute; top: 0; right: -3px; width: 6px; height: 100%;
    cursor: col-resize; z-index: 6;
  }
  .row-resizer {
    position: absolute; left: 0; bottom: -3px; height: 6px; width: 100%;
    cursor: row-resize; z-index: 6;
  }

  /* ---------- Sheet tabs ---------- */
  .tabbar {
    display: flex; align-items: center; gap: 2px; background: var(--bg-darker);
    border-top: 1px solid var(--border); padding: 3px 6px; overflow-x: auto;
  }
  .tab {
    padding: 5px 12px; background: var(--bg-dark); border: 1px solid var(--border);
    border-bottom: none; border-radius: 5px 5px 0 0; cursor: pointer; font-size: 12px;
    white-space: nowrap; user-select: none; display: flex; align-items: center; gap: 6px; color: var(--comment);
  }
  .tab.active { background: var(--bg); font-weight: 600; color: var(--green); }
  .tab .close { color: var(--comment); font-weight: 700; }
  .tab .close:hover { color: var(--red); }
  .tab-add {
    padding: 5px 10px; background: none; border: none; cursor: pointer;
    font-size: 16px; color: var(--comment); line-height: 1;
  }
  .tab-add:hover { color: var(--green); }

  /* ---------- Status bar ---------- */
  .status {
    border-top: 1px solid var(--border); background: var(--bg-dark); padding: 3px 10px;
    display: flex; gap: 18px; font-size: 12px; color: var(--fg);
  }
  .status .stat { min-width: 90px; color: var(--cyan); }
  .status .right { margin-left: auto; color: var(--comment); }

  /* dark scrollbars */
  .grid-wrap::-webkit-scrollbar { width: 12px; height: 12px; }
  .grid-wrap::-webkit-scrollbar-track { background: var(--bg-dark); }
  .grid-wrap::-webkit-scrollbar-thumb { background: var(--current); border-radius: 6px; border: 2px solid var(--bg-dark); }
  .grid-wrap::-webkit-scrollbar-thumb:hover { background: var(--comment); }

  /* ---------- Context menu ---------- */
  .ctx-menu {
    position: fixed; z-index: 1000; background: var(--panel);
    border: 1px solid var(--border); border-radius: 6px;
    box-shadow: 0 10px 26px rgba(0,0,0,0.55); padding: 4px 0; min-width: 190px;
    font-size: 12.5px; color: var(--fg); user-select: none;
  }
  .ctx-menu .ci {
    padding: 6px 14px; cursor: pointer; display: flex;
    justify-content: space-between; align-items: center; gap: 24px; white-space: nowrap;
  }
  .ctx-menu .ci:hover { background: var(--current); color: var(--green); }
  .ctx-menu .ci.disabled { color: var(--comment); cursor: default; }
  .ctx-menu .ci.disabled:hover { background: transparent; color: var(--comment); }
  .ctx-menu .ci .sc { color: var(--comment); font-size: 11px; }
  .ctx-menu .ci:hover .sc { color: var(--fg); }
  .ctx-menu .sep { height: 1px; background: var(--border); margin: 4px 0; }

  /* ---------- AutoFilter ---------- */
  table.grid td.filter-cell { padding-right: 20px; }
  .filter-btn {
    position: absolute; right: 2px; top: 50%; transform: translateY(-50%);
    width: 15px; height: 16px; line-height: 14px; text-align: center;
    background: var(--current); border: 1px solid #565968; border-radius: 3px;
    font-size: 9px; color: var(--comment); cursor: pointer;
  }
  .filter-btn:hover { background: var(--comment); color: var(--fg); }
  .filter-btn.active { color: var(--green); border-color: var(--green); }

  .filter-pop {
    position: fixed; z-index: 1100; background: var(--panel);
    border: 1px solid var(--border); border-radius: 6px;
    box-shadow: 0 10px 26px rgba(0,0,0,0.55); width: 230px;
    font-size: 12.5px; color: var(--fg); user-select: none; display: none;
  }
  .filter-pop .fp-item { padding: 7px 12px; cursor: pointer; display: flex; gap: 8px; align-items: center; }
  .filter-pop .fp-item:hover { background: var(--current); color: var(--green); }
  .filter-pop .fp-sep { height: 1px; background: var(--border); margin: 3px 0; }
  .filter-pop .fp-search { margin: 8px 10px; width: calc(100% - 20px); box-sizing: border-box;
    background: var(--bg-dark); border: 1px solid var(--border); border-radius: 4px;
    color: var(--fg); padding: 5px 8px; outline: none; }
  .filter-pop .fp-list { max-height: 210px; overflow: auto; padding: 2px 0; }
  .filter-pop label.fp-chk { display: flex; gap: 8px; align-items: center; padding: 4px 12px; cursor: pointer; white-space: nowrap; }
  .filter-pop label.fp-chk:hover { background: var(--current); }
  .filter-pop label.fp-chk span { overflow: hidden; text-overflow: ellipsis; }
  .filter-pop .fp-foot { display: flex; gap: 6px; justify-content: flex-end; padding: 8px 10px; border-top: 1px solid var(--border); }
  .filter-pop .fp-foot button {
    border: 1px solid #565968; background: var(--current); color: var(--fg);
    border-radius: 4px; padding: 5px 12px; cursor: pointer; font-size: 12px;
  }
  .filter-pop .fp-foot button.primary { background: var(--purple); border-color: var(--purple); color: var(--bg-dark); font-weight: 600; }
  .filter-pop .fp-foot button:hover { background: var(--comment); }
  .filter-pop .fp-foot button.primary:hover { background: var(--pink); }
</style>
</head>
<body>

<!-- Quick Access strip -->
<div class="qat">
  <span class="app-title">📊 WebSheets</span>
  <button class="qat-btn" id="btnUndo" title="Undo (Ctrl+Z)">↶</button>
  <button class="qat-btn" id="btnRedo" title="Redo (Ctrl+Y)">↷</button>
  <span class="filename" id="fileName">Untitled.xlsx</span>
</div>

<!-- Single-row icon toolbar -->
<div class="toolbar2">
  <button class="tb" id="btnNew" title="New workbook">🆕</button>
  <label class="tb" id="btnOpen" title="Open .xlsx / .xls / .csv">📂<input type="file" id="fileInput" accept=".xlsx,.xls,.csv"></label>
  <button class="tb" id="btnSaveXlsx" title="Save as .xlsx (all sheets)">💾</button>
  <button class="tb" id="btnSaveCsv" title="Save current sheet as .csv">📄</button>
  <span class="tsep"></span>
  <button class="tb" id="btnCut" title="Cut (Ctrl+X)">✂</button>
  <button class="tb" id="btnCopy" title="Copy (Ctrl+C)">⧉</button>
  <button class="tb" id="btnPaste" title="Paste (Ctrl+V)">📋</button>
  <span class="tsep"></span>
  <select id="fontFamily" title="Font">
    <option>Calibri</option><option>Arial</option><option>Times New Roman</option>
    <option>Courier New</option><option>Georgia</option><option>Verdana</option>
    <option>Tahoma</option><option>Comic Sans MS</option><option>Consolas</option>
  </select>
  <select id="fontSize" title="Font size">
    <option>8</option><option>9</option><option>10</option><option>11</option>
    <option selected>13</option><option>14</option><option>16</option><option>18</option>
    <option>20</option><option>24</option><option>28</option><option>36</option>
  </select>
  <button class="tb" id="btnBold" title="Bold (Ctrl+B)" style="font-weight:700">B</button>
  <button class="tb" id="btnItalic" title="Italic (Ctrl+I)" style="font-style:italic">I</button>
  <button class="tb" id="btnUnderline" title="Underline (Ctrl+U)" style="text-decoration:underline">U</button>
  <button class="tb colorbtn" id="textColor" title="Font color"><span class="cb-icon">A</span><span class="cb-swatch" id="textSwatch"></span></button>
  <button class="tb colorbtn" id="fillColor" title="Cell background color"><span class="cb-icon">🪣</span><span class="cb-swatch" id="fillSwatch"></span></button>
  <button class="tb" id="btnNoFill" title="Remove cell background (no fill)">✕</button>
  <span class="tsep"></span>
  <button class="tb" id="alignLeft" title="Align left">⯇</button>
  <button class="tb" id="alignCenter" title="Align center">≡</button>
  <button class="tb" id="alignRight" title="Align right">⯈</button>
  <span class="tsep"></span>
  <select id="numFmt" title="Number format">
    <option value="general">General</option>
    <option value="number">Number (1,234.50)</option>
    <option value="currency">Currency ($1,234.50)</option>
    <option value="percent">Percent (12.50%)</option>
    <option value="comma">Comma (1,234.50)</option>
    <option value="scientific">Scientific (1.23E+3)</option>
    <option value="date">Date</option>
    <option value="text">Text</option>
  </select>
  <button class="tb" id="btnFmtCurrency" title="Currency format ($)">$</button>
  <button class="tb" id="btnFmtPercent" title="Percent format (%)">%</button>
  <span class="tsep"></span>
  <button class="tb" id="btnClear" title="Clear contents of selected cells">🧹</button>
  <button class="tb" id="btnClearFmt" title="Clear formatting">🚫</button>
  <span class="tsep"></span>
  <button class="tb" id="btnAddRow" title="Insert row above selection"><svg viewBox="0 0 16 16" width="16" height="16" fill="none" style="display:block"><rect x="1.5" y="9.5" width="13" height="4" rx="1" fill="currentColor" opacity=".5"/><path d="M8 1.5v5M5.5 4h5" stroke="var(--green)" stroke-width="1.7" stroke-linecap="round"/></svg></button>
  <button class="tb" id="btnDelRow" title="Delete selected row(s)"><svg viewBox="0 0 16 16" width="16" height="16" fill="none" style="display:block"><rect x="1.5" y="9.5" width="13" height="4" rx="1" fill="currentColor" opacity=".5"/><path d="M5.5 4h5" stroke="var(--red)" stroke-width="1.7" stroke-linecap="round"/></svg></button>
  <button class="tb" id="btnAddCol" title="Insert column left of selection"><svg viewBox="0 0 16 16" width="16" height="16" fill="none" style="display:block"><rect x="9.5" y="1.5" width="4" height="13" rx="1" fill="currentColor" opacity=".5"/><path d="M4 5.5v5M1.5 8h5" stroke="var(--green)" stroke-width="1.7" stroke-linecap="round"/></svg></button>
  <button class="tb" id="btnDelCol" title="Delete selected column(s)"><svg viewBox="0 0 16 16" width="16" height="16" fill="none" style="display:block"><rect x="9.5" y="1.5" width="4" height="13" rx="1" fill="currentColor" opacity=".5"/><path d="M1.5 8h5" stroke="var(--red)" stroke-width="1.7" stroke-linecap="round"/></svg></button>
  <button class="tb" id="btnAddSheet" title="Add a new sheet">🗂</button>
  <span class="tsep"></span>
  <button class="tb" id="btnSortAsc" title="Sort selected column ascending">▲</button>
  <button class="tb" id="btnSortDesc" title="Sort selected column descending">▼</button>
  <span class="tsep"></span>
  <button class="tb" id="btnHelp" title="Keyboard shortcuts" style="margin-left:auto;font-weight:700">?</button>
</div>

<div class="formula-bar">
  <input class="name-box" id="nameBox" value="A1" spellcheck="false">
  <span class="fx">fx</span>
  <input class="formula-input" id="formulaInput" spellcheck="false" placeholder="Enter a value or =formula">
</div>

<div class="grid-wrap" id="gridWrap">
  <table class="grid" id="grid"></table>
</div>

<div class="tabbar" id="tabbar"></div>

<div class="status">
  <span class="stat" id="statCell">Ready</span>
  <span class="stat" id="statCount"></span>
  <span class="stat" id="statSum"></span>
  <span class="stat" id="statAvg"></span>
  <span class="right">Double-click / Enter to edit • Ctrl+B/I/U format • =SUM(A1:A5)</span>
</div>

<script>
"use strict";
/* =====================================================================
   WebSheets - single file, multi-sheet workbook
   Sheet = { name, data:{ "r,c":{raw} }, fmt:{ "r,c":{...} },
             colWidths:{c:px}, numRows, numCols, sortState }
   ===================================================================== */

const MIN_ROWS = 100, MIN_COLS = 26;
const HEADER_H = 24, ROWHEAD_W = 42;   // column-header height / row-header width (for scroll math)
let _lastHeadH = 0;                    // cached column-header height for the frozen-row sticky offset

function newSheet(name) {
  return { name, data: {}, fmt: {}, colWidths: {}, rowHeights: {}, filters: {}, numRows: MIN_ROWS, numCols: MIN_COLS, sortState: { col: null, dir: 0 } };
}
let workbook = { sheets: [newSheet('Sheet1')], active: 0 };
const S = () => workbook.sheets[workbook.active];

  const sep = document.createElement('div'); sep.className = 'fp-sep'; filterPop.appendChild(sep);

  const search = document.createElement('input');

  const syncAll = () => { const vis = boxes.filter(b => b.lbl.style.display !== 'none'); allCb.checked = vis.every(b => b.cb.checked); };

  search.oninput = () => { const q = search.value.toLowerCase(); boxes.forEach(b => { b.lbl.style.display = label(b.v).toLowerCase().includes(q) ? '' : 'none'; }); syncAll(); };
  syncAll();

  const foot = document.createElement('div'); foot.className = 'fp-foot';

  const ok = document.createElement('button'); ok.className = 'primary'; ok.textContent = 'OK';

    const checked = pool.filter(b => b.cb.checked).map(b => b.v);

  const w = filterPop.offsetWidth, h = filterPop.offsetHeight;

  if (y + h > window.innerHeight) y = window.innerHeight - h - 4;

}

function copySelection() {
  const r0 = Math.min(sel.r, rangeEnd.r), r1 = Math.max(sel.r, rangeEnd.r);
  const c0 = Math.min(sel.c, rangeEnd.c), c1 = Math.max(sel.c, rangeEnd.c);
  let rows = [];
  for (let r = r0; r <= r1; r++) { let row = []; for (let c = c0; c <= c1; c++) row.push(getComputed(r, c)); rows.push(row.join('\t')); }
  navigator.clipboard?.writeText(rows.join('\n')).catch(() => {});
}
document.addEventListener('paste', e => {

  const text = (e.clipboardData || window.clipboardData).getData('text'); if (!text) return;
  e.preventDefault(); pushUndo();
  const rows = text.replace(/\r/g, '').split('\n'); if (rows.length && rows[rows.length - 1] === '') rows.pop();
  rows.forEach((line, dr) => line.split('\t').forEach((val, dc) => {
    const r = sel.r + dr, c = sel.c + dc;
    if (r >= S().numRows) S().numRows = r + 1;

  }));

});

/* =====================================================================
   SORTING
   ===================================================================== */
function sortByColumn(col, dir) {
  pushUndo();
  const sh = S();
  let maxRow = -1;
  for (const kk in sh.data) { const r = +kk.split(',')[0]; if (r > maxRow) maxRow = r; }
  if (maxRow < 1) { undoStack.pop(); return; }
  // Row 0 is always the AutoFilter header, so it stays put.
  const startRow = 1;
  const rowsArr = [];
  for (let r = startRow; r <= maxRow; r++) {
    const rowObj = {}, fmtObj = {};
    for (let c = 0; c < sh.numCols; c++) { rowObj[c] = getRaw(r, c); if (sh.fmt[key(r, c)]) fmtObj[c] = sh.fmt[key(r, c)]; }
    rowsArr.push({ keyVal: getComputed(r, col), cells: rowObj, fmts: fmtObj });
  }
  rowsArr.sort((a, b) => {
    let av = a.keyVal, bv = b.keyVal;
    const an = parseFloat(av), bn = parseFloat(bv);
    const bothNum = av !== '' && bv !== '' && !isNaN(an) && !isNaN(bn);
    let cmp;
    if (bothNum) cmp = an - bn;
    else { if (av === '' && bv !== '') return 1; if (bv === '' && av !== '') return -1; cmp = String(av).localeCompare(String(bv), undefined, { numeric: true, sensitivity: 'base' }); }
    return dir === 1 ? cmp : -cmp;
  });
  rowsArr.forEach((row, idx) => {
    const r = startRow + idx;
    for (let c = 0; c < sh.numCols; c++) {
      setRaw(r, c, row.cells[c]);
      if (row.fmts[c]) sh.fmt[key(r, c)] = row.fmts[c]; else delete sh.fmt[key(r, c)];
    }
  });
  sh.sortState = { col, dir };
  render();
}

function switchSheet(i) {

function addSheet() {

/* =====================================================================
   FILE I/O
   ===================================================================== */
function loadWorkbook(wb) {
  const sheets = wb.SheetNames.map(name => {
    const sheet = wb.Sheets[name];
    const aoa = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '', raw: false });
    const s = newSheet(name.slice(0, 31) || 'Sheet');
    let maxC = 0;
    aoa.forEach((row, r) => row.forEach((val, c) => { if (val !== null && val !== undefined && val !== '') s.data[key(r, c)] = { raw: String(val) }; if (c + 1 > maxC) maxC = c + 1; }));
    s.numRows = Math.max(MIN_ROWS, aoa.length + 10);
    s.numCols = Math.max(MIN_COLS, maxC + 3);
    return s;
  });
  workbook = { sheets: sheets.length ? sheets : [newSheet('Sheet1')], active: 0 };
  undoStack = []; redoStack = [];
  sel = { r: 0, c: 0 }; rangeEnd = { r: 0, c: 0 };
  renderTabs(); render();
}
function sheetToAOA(sh) {
  let maxR = 0, maxC = 0;
  for (const kk in sh.data) { const [r, c] = kk.split(',').map(Number); if (r + 1 > maxR) maxR = r + 1; if (c + 1 > maxC) maxC = c + 1; }
  const aoa = [];
  const prevActive = workbook.active;
  workbook.active = workbook.sheets.indexOf(sh);
  for (let r = 0; r < maxR; r++) {
    const row = [];
    for (let c = 0; c < maxC; c++) {
      const raw = getRaw(r, c);
      if (raw === '') { row.push(null); continue; }
      let out = raw[0] === '=' ? getComputed(r, c) : raw;
      const n = parseFloat(out);
      if (out !== '' && !isNaN(n) && String(n) === String(out).trim()) out = n;
      row.push(out);
    }
    aoa.push(row);
  }
  workbook.active = prevActive;
  return aoa;
}
document.getElementById('fileInput').addEventListener('change', e => {
  const file = e.target.files[0]; if (!file) return;
  currentFileName = file.name; document.getElementById('fileName').textContent = file.name;
  const reader = new FileReader(); const isCsv = /\.csv$/i.test(file.name);
  reader.onload = ev => {
    try { const wb = XLSX.read(ev.target.result, { type: isCsv ? 'string' : 'array' }); loadWorkbook(wb); }
    catch (err) { alert('Failed to open file: ' + err.message); }
  };
  if (isCsv) reader.readAsText(file); else reader.readAsArrayBuffer(file);
  e.target.value = '';
});
function exportFile(type) {
  const wb = XLSX.utils.book_new();
  const base = currentFileName.replace(/\.(xlsx|xls|csv)$/i, '') || 'spreadsheet';
  if (type === 'csv') {
    const ws = XLSX.utils.aoa_to_sheet(sheetToAOA(S()));
    XLSX.utils.book_append_sheet(wb, ws, S().name);
    XLSX.writeFile(wb, base + '.csv', { bookType: 'csv' });
  } else {
    workbook.sheets.forEach(sh => {
      const ws = XLSX.utils.aoa_to_sheet(sheetToAOA(sh));
      let nm = sh.name.replace(/[\\/?*:\[\]]/g, '').slice(0, 31) || 'Sheet';
      XLSX.utils.book_append_sheet(wb, ws, nm);
    });
    XLSX.writeFile(wb, base + '.xlsx', { bookType: 'xlsx' });
  }
}

/* Insert a blank row above `at`, shifting existing rows (and their formats) down. */
function insertRowAt(at) {
  pushUndo();
  const sh = S();
  const nd = {}, nf = {};
  for (const kk in sh.data) { const [r, c] = kk.split(',').map(Number); nd[key(r >= at ? r + 1 : r, c)] = sh.data[kk]; }
  for (const kk in sh.fmt)  { const [r, c] = kk.split(',').map(Number); nf[key(r >= at ? r + 1 : r, c)] = sh.fmt[kk]; }
  const nh = {}; for (const rr in (sh.rowHeights || {})) { const r = +rr; nh[r >= at ? r + 1 : r] = sh.rowHeights[rr]; }
  sh.data = nd; sh.fmt = nf; sh.rowHeights = nh; sh.numRows += 1;
  sh.sortState = { col: null, dir: 0 };
  render();
}
/* Insert a blank column left of `at`, shifting existing columns (data, formats, widths) right. */
function insertColAt(at) {
  pushUndo();
  const sh = S();
  const nd = {}, nf = {}, nw = {};
  for (const kk in sh.data) { const [r, c] = kk.split(',').map(Number); nd[key(r, c >= at ? c + 1 : c)] = sh.data[kk]; }
  for (const kk in sh.fmt)  { const [r, c] = kk.split(',').map(Number); nf[key(r, c >= at ? c + 1 : c)] = sh.fmt[kk]; }
  for (const cc in sh.colWidths) { const c = +cc; nw[c >= at ? c + 1 : c] = sh.colWidths[cc]; }
  sh.data = nd; sh.fmt = nf; sh.colWidths = nw; sh.numCols += 1;
  sh.sortState = { col: null, dir: 0 };
  render();
}
/* Delete `count` rows starting at `from`, shifting rows below up. */
function deleteRows(from, count) {
  pushUndo();
  const sh = S();
  const nd = {}, nf = {}, nh = {};
  for (const kk in sh.data) { const [r, c] = kk.split(',').map(Number); if (r >= from && r < from + count) continue; nd[key(r >= from ? r - count : r, c)] = sh.data[kk]; }
  for (const kk in sh.fmt)  { const [r, c] = kk.split(',').map(Number); if (r >= from && r < from + count) continue; nf[key(r >= from ? r - count : r, c)] = sh.fmt[kk]; }
  for (const rr in (sh.rowHeights || {})) { const r = +rr; if (r >= from && r < from + count) continue; nh[r >= from ? r - count : r] = sh.rowHeights[rr]; }
  sh.data = nd; sh.fmt = nf; sh.rowHeights = nh;
  sh.numRows = Math.max(MIN_ROWS, sh.numRows - count);
  sh.sortState = { col: null, dir: 0 };
  sel.r = Math.min(sel.r, sh.numRows - 1); rangeEnd = { ...sel };
  render();
}
/* Delete `count` columns starting at `from`, shifting columns right of them left. */
function deleteCols(from, count) {
  pushUndo();
  const sh = S();
  const nd = {}, nf = {}, nw = {};
  for (const kk in sh.data) { const [r, c] = kk.split(',').map(Number); if (c >= from && c < from + count) continue; nd[key(r, c >= from ? c - count : c)] = sh.data[kk]; }
  for (const kk in sh.fmt)  { const [r, c] = kk.split(',').map(Number); if (c >= from && c < from + count) continue; nf[key(r, c >= from ? c - count : c)] = sh.fmt[kk]; }
  for (const cc in sh.colWidths) { const c = +cc; if (c >= from && c < from + count) continue; nw[c >= from ? c - count : c] = sh.colWidths[cc]; }
  sh.data = nd; sh.fmt = nf; sh.colWidths = nw;
  sh.numCols = Math.max(MIN_COLS, sh.numCols - count);
  sh.sortState = { col: null, dir: 0 };
  sel.c = Math.min(sel.c, sh.numCols - 1); rangeEnd = { ...sel };

async function pasteFromClipboard() {
  try {

    if (!text) return;
    pushUndo();
    const rows = text.replace(/\r/g, '').split('\n'); if (rows.length && rows[rows.length - 1] === '') rows.pop();
    rows.forEach((line, dr) => line.split('\t').forEach((val, dc) => {
      const r = sel.r + dr, c = sel.c + dc;
      if (r >= S().numRows) S().numRows = r + 1;

}
// Close on mousedown (not click): a click on a cell re-renders the grid and
// removes the element mid-gesture, so no click event is ever dispatched.
document.addEventListener('mousedown', e => { if (!ctxMenu.contains(e.target)) hideMenu(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') hideMenu(); });
gridWrap.addEventListener('scroll', hideMenu);
window.addEventListener('blur', hideMenu);

const clipItems = () => ([
  { label: '✂ Cut', shortcut: 'Ctrl+X', fn: () => { copySelection(); clearSelection(); } },
  { label: '⧉ Copy', shortcut: 'Ctrl+C', fn: () => copySelection() },
  { label: '📋 Paste', shortcut: 'Ctrl+V', fn: pasteFromClipboard },
]);
function clearFmtSelection() { pushUndo(); for (const { r, c } of selectionCells()) delete S().fmt[key(r, c)]; render(); }
function selExtent() {
  return {
    r0: Math.min(sel.r, rangeEnd.r), r1: Math.max(sel.r, rangeEnd.r),
    c0: Math.min(sel.c, rangeEnd.c), c1: Math.max(sel.c, rangeEnd.c),
  };
}

gridEl.addEventListener('contextmenu', e => {
  const td = e.target.closest('td');
  const ch = e.target.closest('th.colhead');
  const rh = e.target.closest('th.rowhead');
  if (td) {
    const r = +td.dataset.r, c = +td.dataset.c;
    if (!inRange(r, c)) selectCell(r, c);
    const { r0, r1, c0, c1 } = selExtent();
    const rc = r1 - r0 + 1, cc = c1 - c0 + 1;
    showMenu(e.clientX, e.clientY, [
      ...clipItems(),
      { sep: true },
      { label: 'Insert Row Above', fn: () => insertRowAt(r0) },
      { label: 'Insert Column Left', fn: () => insertColAt(c0) },
      { label: `Delete Row${rc > 1 ? 's' : ''}`, fn: () => deleteRows(r0, rc) },
      { label: `Delete Column${cc > 1 ? 's' : ''}`, fn: () => deleteCols(c0, cc) },
      { sep: true },
      { label: '🧹 Clear Contents', shortcut: 'Del', fn: clearSelection },
      { label: '🚫 Clear Formatting', fn: clearFmtSelection },
      { sep: true },
      { label: '▲ Sort A→Z', fn: () => sortByColumn(sel.c, 1) },
      { label: '▼ Sort Z→A', fn: () => sortByColumn(sel.c, -1) },
    ]);
  } else if (ch) {
    const c = +ch.dataset.c;
    let { c0, c1 } = selExtent();
    if (c < c0 || c > c1) { selKind = 'col'; sel = { r: 0, c }; rangeEnd = { r: S().numRows - 1, c }; render(); ({ c0, c1 } = selExtent()); }
    const cc = c1 - c0 + 1;
    showMenu(e.clientX, e.clientY, [
      ...clipItems(),
      { sep: true },
      { label: 'Insert Column Left', fn: () => insertColAt(c0) },
      { label: `Delete Column${cc > 1 ? 's' : ''}`, fn: () => deleteCols(c0, cc) },
      { label: '🧹 Clear Contents', fn: clearSelection },
      { sep: true },
      { label: '▲ Sort A→Z', fn: () => sortByColumn(c, 1) },
      { label: '▼ Sort Z→A', fn: () => sortByColumn(c, -1) },
    ]);
  } else if (rh) {
    const r = +rh.dataset.r;
    let { r0, r1 } = selExtent();
    if (r < r0 || r > r1) { selKind = 'row'; sel = { r, c: 0 }; rangeEnd = { r, c: S().numCols - 1 }; render(); ({ r0, r1 } = selExtent()); }
    const rc = r1 - r0 + 1;
    showMenu(e.clientX, e.clientY, [
      ...clipItems(),
      { sep: true },
      { label: 'Insert Row Above', fn: () => insertRowAt(r0) },
      { label: `Delete Row${rc > 1 ? 's' : ''}`, fn: () => deleteRows(r0, rc) },
      { label: '🧹 Clear Contents', fn: clearSelection },
    ]);
  }
});


/* =====================================================================
   HELP / SHORTCUTS PANEL
   ===================================================================== */
const HELP_GROUPS = [
  ['Navigation', [
    ['↑ ↓ ← →', 'Move one cell'],
    ['Tab / Shift+Tab', 'Move right / left'],
    ['Ctrl+← / Ctrl+→', 'Jump to start / end of row'],
    ['Ctrl+↑ / Ctrl+↓', 'Jump to top / bottom of column'],
    ['Ctrl+Home / Ctrl+End', 'Go to A1 / last used cell'],
    ['Home', 'Start of current row'],
    ['Shift+Arrows', 'Extend selection'],
    ['Ctrl+Space', 'Select whole column'],
    ['Shift+Space', 'Select whole row'],
    ['Name box + Enter', 'Jump to a cell (e.g. B12)'],
  ]],
  ['Editing', [
    ['Enter / F2 / Double-click', 'Edit the active cell'],
    ['Esc', 'Cancel the current edit'],
    ['Delete / Backspace', 'Clear cell contents'],
    ['Type any character', 'Overwrite the cell'],
    ['= to start', 'Enter a formula, e.g. =SUM(A1:A5)'],
  ]],
  ['Clipboard', [
    ['Ctrl+C / Ctrl+X / Ctrl+V', 'Copy / Cut / Paste'],
  ]],
  ['Formatting', [
    ['Ctrl+B / Ctrl+I / Ctrl+U', 'Bold / Italic / Underline'],
  ]],
  ['Undo / Redo', [
    ['Ctrl+Z', 'Undo'],
    ['Ctrl+Y / Ctrl+Shift+Z', 'Redo'],
  ]],
  ['Sheets', [
    ['Ctrl+.', 'Next sheet (right)'],
    ['Ctrl+,', 'Previous sheet (left)'],
  ]],
  ['Mouse', [
    ['Drag row / column headers', 'Select multiple rows / columns'],
    ['Drag cell or header edges', 'Resize columns & rows'],
    ['Right-click', 'Context menu (insert, delete, sort…)'],
    ['▾ on the header row', 'Filter / sort a column'],
  ]],
];
const helpPop = document.createElement('div');
helpPop.className = 'help-pop';
helpPop.innerHTML = '<div class="help-title">⌨ Keyboard &amp; mouse shortcuts</div>' +
  HELP_GROUPS.map(([title, rows]) =>
    `<h4>${title}</h4>` + rows.map(([k, d]) => `<div class="krow"><kbd>${k}</kbd><span class="kdesc">${d}</span></div>`).join('')
  ).join('');
document.body.appendChild(helpPop);
const btnHelp = document.getElementById('btnHelp');
let helpTimer = null;
function showHelp() {
  clearTimeout(helpTimer);
  helpPop.style.display = 'block';
  const r = btnHelp.getBoundingClientRect(), w = helpPop.offsetWidth;
  helpPop.style.left = Math.max(4, r.right - w) + 'px';
  helpPop.style.top = (r.bottom + 4) + 'px';
}
function hideHelpSoon() { helpTimer = setTimeout(() => { helpPop.style.display = 'none'; }, 180); }
btnHelp.addEventListener('mouseenter', showHelp);
btnHelp.addEventListener('mouseleave', hideHelpSoon);
btnHelp.addEventListener('click', () => { helpPop.style.display === 'block' ? hideHelpSoon() : showHelp(); });
helpPop.addEventListener('mouseenter', () => clearTimeout(helpTimer));
helpPop.addEventListener('mouseleave', hideHelpSoon);
document.addEventListener('keydown', e => { if (e.key === 'Escape') helpPop.style.display = 'none'; });

/* =====================================================================
   INIT (starts with a single empty sheet)
   ===================================================================== */
renderTabs();
render();
focusGrid();
</script>
